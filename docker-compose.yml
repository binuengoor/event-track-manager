services:
  # 1. Main Web Application: Google Sheets Sync, Drive Archival, Stage Console & Intake Portal
  app:
    # Reference pre-built multi-architecture image from GitHub Container Registry
    image: ghcr.io/binuengoor/event-track-manager-app:latest
    # To build locally from source instead of pulling from GHCR, uncomment the build block below:
    # build:
    #   context: .
    #   dockerfile: app/Dockerfile
    container_name: event_track_manager_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8088}:8000"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - ADMIN_PIN=${ADMIN_PIN:-2026}
      - DOWNLOADER_SERVICE_URL=http://downloader:8001
      - CACHE_DIR=/data/cache
      - GOOGLE_CREDENTIALS_PATH=/secrets/credentials.json
      - MOCK_GOOGLE_API=${MOCK_GOOGLE_API:-false}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./secrets:/secrets:ro
      - audio_cache:/data/cache
    depends_on:
      - downloader

  # 2. Dedicated Downloader Microservice: yt-dlp + ffmpeg audio extractor
  downloader:
    # Reference pre-built multi-architecture image from GitHub Container Registry
    image: ghcr.io/binuengoor/event-track-manager-downloader:latest
    # To build locally from source instead of pulling from GHCR, uncomment the build block below:
    # build:
    #   context: ./downloader
    #   dockerfile: Dockerfile
    container_name: event_track_manager_downloader
    restart: unless-stopped
    environment:
      - CACHE_DIR=/data/cache
      - COOKIES_PATH=/secrets/yt_cookies.txt
    volumes:
      - ./secrets:/secrets:ro
      - audio_cache:/data/cache

volumes:
  audio_cache:
    driver: local
