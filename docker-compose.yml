services:
  # 1. Main web application. All event data lives in ./events/<EVENT_ID>/ (database, signups.xlsx, tracks/, backups/)
  app:
    image: ghcr.io/binuengoor/event-track-manager-app:latest
    container_name: event_track_manager_app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-8088}:8000"
    environment:
      - RUNTIME_ENV=docker
      - CONFIG_PATH=/app/config.yaml
      - ADMIN_PIN=${ADMIN_PIN:-2026}
      - EVENTS_DIR=/events
      - DOWNLOADER_SERVICE_URL=http://downloader:8001
      - CACHE_DIR=/data/cache
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./events:/events
      - audio_cache:/data/cache
    depends_on:
      - downloader

  # 2. YouTube/SoundCloud extractor (yt-dlp + ffmpeg). Hands finished files to the app through the scratch volume.
  downloader:
    image: ghcr.io/binuengoor/event-track-manager-downloader:latest
    container_name: event_track_manager_downloader
    restart: unless-stopped
    environment:
      - RUNTIME_ENV=docker
      - CACHE_DIR=/data/cache
      - COOKIES_PATH=/secrets/yt_cookies.txt      # optional: export cookies.txt from a logged-in browser
      - YTDLP_AUTO_UPDATE=${YTDLP_AUTO_UPDATE:-true}
      - YTDLP_UPDATE_HOURS=${YTDLP_UPDATE_HOURS:-24}
    volumes:
      - ./secrets:/secrets:ro
      - audio_cache:/data/cache
      - ytdlp_pkgs:/home/appuser/.local          # keeps the auto-updated yt-dlp across restarts

  # 3. Optional cloud sync sidecar (Google Drive, S3, NAS, ...). Start with: docker compose --profile sync up -d
  rclone-sync:
    image: rclone/rclone:1
    container_name: event_track_manager_rclone
    profiles: ["sync"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/sync.sh"]
    environment:
      - EVENTS_DIR=/events
      - EVENT_ID=${EVENT_ID:-paattukoottam-2026}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
      - RCLONE_TRASH=${RCLONE_TRASH:-}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-30}
      - RCLONE_CONFIG=/config/rclone/rclone.conf
    volumes:
      - ./events:/events
      - ./rclone:/config/rclone
      - ./rclone/sync.sh:/sync.sh:ro

volumes:
  audio_cache:
    driver: local
  ytdlp_pkgs:
    driver: local
