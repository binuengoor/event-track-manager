# Development Docker Compose override: enables local builds and live source code reloading
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      - RUNTIME_ENV=docker
      - MOCK_GOOGLE_API=true
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests

  downloader:
    build:
      context: ./downloader
      dockerfile: Dockerfile
