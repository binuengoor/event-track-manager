# EMA Paattukoottam Event & Track Manager Configuration
event:
  id: "paattukoottam-2026"
  header_brand_title: "EMA Paattukoottam"
  header_brand_subtitle: "Musical Night"
  name: "✨🎤✨ Paattukoottam ✨🎶✨ Sing & Serenade ✨🎶✨"
  subtitle: "Musical Night • September 19, 2026"
  start_time: "09-19-2026 05:00PM"
  poster_url: "/data/paattukoottam_animated.gif"   # file lives in the event folder
  venue: "1 Scouting Wy, Exton, PA 19341, USA"
  time_range: "5:00 PM - 9:00 PM EDT"

storage:
  # Everything for an event lives in <events_dir>/<event id>/ (database, signups.xlsx, tracks/, backups/).
  # Set EVENTS_DIR / EVENT_DIR in the environment to relocate it. cache_dir is disposable scratch space.
  cache_dir: "/data/cache"
  max_upload_size_mb: 100

downloader:
  service_url: "http://downloader:8001"
  timeout_seconds: 120

signup:
  food_signup_enabled: true
  food_serving_note: "Half-Tray or Above (15+ servings)"
  max_performances_per_participant: 2
  max_solo_per_participant: 1
  performance_types:
    - "Solo"
    - "Duet"
    - "Group"
  age_groups:
    - name: "Junior"
      requires_guardian: true
    - name: "Senior"
      requires_guardian: false

backup:
  enabled: true          # writes signups.xlsx/csv + database snapshots into the event folder
  keep_snapshots: 30
  debounce_seconds: 10

