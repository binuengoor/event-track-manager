# EMA Paattukoottam Event & Track Manager Configuration
event:
  id: "paattukoottam-2026"
  name: "EMA Paattukoottam Musical Evening"

google:
  # Path to Google Cloud Service Account JSON Key
  service_account_json_path: "./secrets/credentials.json"
  # Target Google Sheet ID
  sheet_id: "1bRvoj4ZlAmSRz972uhTDMfXlYgksH-BOH-zmygp5YRQ"
  sheet_range: "Song Sign-Up!A2:O"
  # Google Shared Drive Folder IDs
  drive_folders:
    active_folder_id: "1FQ1goCkaSajLjGv8Yt_vrWTS6krmZufW"
    archive_folder_id: "1T6zqI02lKQfLfqpPRjQOhn561uUEKDil"

# 0-indexed column mappings for the Google Sheet
columns:
  entry_id: -1         # Auto-generated from row index (PK-002, PK-003...)
  performer_name: 0   # Col A: Singer (1)
  performance_type: 5 # Col F: Solo/Duet/Group
  partner_name: 2     # Col C: Singer (2)
  song_title: 8       # Col I: Song Name
  movie_name: 9       # Col J: Movie/Album Name
  youtube_url: 10     # Col K: Karaoke Youtube URL
  sequence_order: 6   # Col G: Sequence
  track_status: 11    # Col L: Track Uploaded
  drive_file_id: 13   # Col N: Drive File ID
  last_updated: 14    # Col O: Last Updated

storage:
  cache_dir: "/data/cache"
  max_upload_size_mb: 50

downloader:
  service_url: "http://downloader:8001"
  timeout_seconds: 120
