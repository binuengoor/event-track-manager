    archive_folder_id: "1T6zqI02lKQfLfqpPRjQOhn561uUEKDil"

# 0-indexed column mappings for the Google Sheet
columns:
  entry_id: -1         # Auto-generated from row index (PK-002, PK-003...)
  performer_name: 0   # Col A: Singer (1)
  performance_type: 5 # Col F: Solo/Duet/Group
  partner_name: 2     # Col C: Singer (2)
  song_title: 8       # Col I: Song Name
  movie_name: 9       # Col J: Movie/Album Name
  performance_status: 10 # Col K: Performance Status
  track_status: 11    # Col L: Track Uploaded / Status
  sequence_order: 6   # Col G: Sequence
  duration: 12        # Col M: Duration (Minutes)
  drive_file_id: 13   # Col N: Drive File ID
  last_updated: 14    # Col O: Last Updated

storage:
  cache_dir: "/data/cache"
  max_upload_size_mb: 200

downloader:
  service_url: "http://downloader:8001"
  timeout_seconds: 120

signup:
  food_signup_enabled: true
  food_serving_note: "Half-Tray or Above (15+ servings)"
  max_performances_per_participant: 2
  max_solo_per_participant: 1
  performance_types:
    - "Solo"
    - "Duet"
    - "Group"
  age_groups:
    - name: "Junior"
      requires_guardian: true
    - name: "Senior"
      requires_guardian: false

backup:
  enabled: true
  drive_folder_id: "1T6zqI02lKQfLfqpPRjQOhn561uUEKDil"
  debounce_seconds: 10

