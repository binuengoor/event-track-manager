<!DOCTYPE html>
<html lang="en" class="bg-black" style="background-color: #000000; color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="view-transition" content="same-origin">
  <title>Schedule - EMA Paattukoottam</title>
  <style>
    :root, html, body {
      background-color: #000000 !important;
      color-scheme: dark;
    }
  </style>
  <script src="/static/vendor/lucide.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/aurora.css">
  <script src="/static/js/aurora.js" defer></script>
<link rel="stylesheet" href="/static/css/app.css?v=1">
<link rel="stylesheet" href="/static/css/guest-forms.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-orange-500 selection:text-white relative">

  <!-- Dynamic Ambient Aurora Fluid Light Effect -->
  <aurora-background></aurora-background>

  <!-- Top Navigation Bar -->
  <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white shadow-lg shadow-orange-500/20 group-hover:scale-105 transition">
          <i data-lucide="music" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 id="nav-event-title" class="font-bold text-base sm:text-lg text-white leading-tight">EMA Paattukoottam</h1>
          <p id="nav-event-subtitle" class="text-xs text-orange-400 font-medium">Musical Night</p>
        </div>
      </a>

      <!-- Quick Nav Links -->
      <nav aria-label="Main"></nav>
    </div>
  </header>
  <script src="/static/js/nav.js"></script>

  <!-- Main Content -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 sm:py-8 space-y-4">

    <div id="offline-banner" class="gf-offline" role="status" aria-live="polite" hidden>
      You are offline. Showing the schedule as of <span id="offline-time"></span>.
    </div>

    <div class="gf-card" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem">
      <div>
        <h2 id="dashboard-header-title" class="text-xl sm:text-2xl font-black text-white m-0">Schedule</h2>
        <p id="dashboard-header-desc" class="gf-muted" style="margin:.25rem 0 0">The running order and the food board.</p>
      </div>
      <div id="dashboard-tabs-container" class="gf-segment" role="group" aria-label="Schedule view">
        <button type="button" id="tab-songs-btn" aria-pressed="true">Lineup <span id="songs-count-badge">0</span></button>
        <button type="button" id="tab-food-btn" aria-pressed="false">Food <span id="food-count-badge">0</span></button>
      </div>
    </div>

    <!-- LINEUP -->
    <section id="section-songs" class="space-y-3" aria-label="Lineup">
      <div style="display:flex;flex-wrap:wrap;gap:.5rem">
        <label for="song-search-input" class="gf-label" style="position:absolute;left:-9999px">Search the lineup</label>
        <input type="search" id="song-search-input" class="gf-input" style="flex:1 1 12rem" placeholder="Search performer or song">
        <label for="type-filter-select" class="gf-label" style="position:absolute;left:-9999px">Filter by type</label>
        <select id="type-filter-select" class="gf-select" style="flex:0 0 auto;width:auto">
          <option value="">All types</option>
          <option value="solo">Solo</option>
          <option value="duet">Duet</option>
          <option value="group">Group</option>
        </select>
        <button type="button" id="refresh-dashboard-btn" class="gf-btn" aria-label="Refresh">Refresh</button>
      </div>
      <ol id="lineup-list" class="gf-lineup" aria-live="polite">
        <li class="gf-muted" style="padding:1.5rem;text-align:center">Loading the lineup...</li>
      </ol>
    </section>

    <!-- FOOD BOARD -->
    <section id="section-food" class="space-y-3" aria-label="Food board" hidden>
      <div class="gf-card">
        <p class="m-0 font-bold text-white"><span id="food-stats-pill">0 of 0 taken</span></p>
        <p id="dashboard-serving-note" class="gf-muted" style="margin:.25rem 0 0"></p>
        <p class="gf-muted" style="margin:.25rem 0 0">You do not have to perform to bring a dish.</p>
        <p style="margin:.75rem 0 0"><a id="bring-dish-link" class="gf-btn gf-btn-primary" href="/signup">Bring a dish</a></p>
      </div>
      <div id="dashboard-food-groups"></div>
    </section>

  </main>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
