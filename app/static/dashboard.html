<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/static/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15110E">
  <meta name="view-transition" content="same-origin">
  <title>Schedule - Event Track Manager</title>
  <script src="/static/js/icons.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/app.css?v=1">
<link rel="stylesheet" href="/static/css/guest-forms.css">
  <link rel="stylesheet" href="/static/css/a11y.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/schedule.css">
</head>
<body class="page-schedule min-h-screen flex flex-col antialiased relative">
  <a class="skip-link" href="#main-content">Skip to main content</a>


  <!-- Top Navigation Bar -->
  <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white shadow-lg shadow-orange-500/20 group-hover:scale-105 transition">
          <i data-lucide="music" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 id="nav-event-title" class="font-bold text-base sm:text-lg text-white leading-tight">Event Track Manager</h1>
          <p id="nav-event-subtitle" class="text-xs text-orange-400 font-medium">Musical Night</p>
        </div>
      </a>

      <!-- Quick Nav Links -->
      <nav aria-label="Main"></nav>
    </div>
  </header>
  <script src="/static/js/nav.js"></script>

  <!-- Main Content -->
  <main id="main-content" class="sch-main flex-1 w-full mx-auto">

    <div id="offline-banner" class="sch-offline" role="status" aria-live="polite" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>
      <span>You are offline. Showing the schedule as of <span id="offline-time" class="sch-mono"></span>.</span>
    </div>

    <div class="sch-head">
      <h2 id="dashboard-header-title" class="sch-title">Schedule</h2>
      <p id="dashboard-header-desc" class="sch-desc">The running order and the food board.</p>
      <div id="dashboard-tabs-container" class="sch-tabs" role="group" aria-label="Schedule view">
        <button type="button" id="tab-songs-btn" aria-pressed="true">Lineup <span id="songs-count-badge" class="sch-count">0</span></button>
        <button type="button" id="tab-food-btn" aria-pressed="false">Food <span id="food-count-badge" class="sch-count">0</span></button>
      </div>
    </div>

    <!-- LINEUP -->
    <section id="section-songs" class="sch-section" aria-label="Lineup">
      <div class="sch-filters">
        <label for="song-search-input" class="sr-only">Search the lineup</label>
        <input type="search" id="song-search-input" class="sch-input" placeholder="Search performer or song">
        <label for="type-filter-select" class="sr-only">Filter by type</label>
        <select id="type-filter-select" class="sch-select">
          <option value="">All types</option>
          <option value="solo">Solo</option>
          <option value="duet">Duet</option>
          <option value="group">Group</option>
        </select>
        <button type="button" id="refresh-dashboard-btn" class="sch-btn" aria-label="Refresh">Refresh</button>
      </div>
      <ol id="lineup-list" class="sch-lineup" aria-live="polite">
        <li class="sch-empty">Loading the lineup...</li>
      </ol>
    </section>

    <!-- FOOD BOARD -->
    <section id="section-food" class="sch-section" aria-label="Food board" hidden>
      <div class="sch-foodhead">
        <div id="food-progress" class="sch-progress" role="progressbar" aria-label="Dishes claimed" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><div id="food-progress-fill" class="sch-progress-fill"></div></div>
        <p class="sch-foodstat"><span id="food-stats-pill">0 of 0 taken</span></p>
        <p id="dashboard-serving-note" class="sch-note"></p>
        <p class="sch-note">You do not have to perform to bring a dish.</p>
        <p class="sch-bring"><a id="bring-dish-link" class="sch-btn" href="/signup">Bring a dish</a></p>
      </div>
      <div id="dashboard-food-groups" class="sch-groups"></div>
    </section>

  </main>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
